apiVersion: v1
kind: ConfigMap 
metadata:
  name: prometheus-config
  namespace: monitoring 
data:
  prometheus.yml: | 
    global:
      scrape_interval: 15s 
    scrape_configs:
      - job_name: 'k3s-node'
        static_configs:
          - targets: ['localhost:9100'] # node-exporter hardware metrics live on port 9100
---

apiVersion: apps/v1 # 
kind: Deployment 
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: prometheus 
  template: 
    metadata:
      labels:
        app: prometheus #
    spec:
      hostNetwork: true #
      containers:
      - name: prometheus
        image: prom/prometheus:latest #
        args:
          - "--config.file=/etc/prometheus/prometheus.yml" #
          - "--storage.tsdb.retention.time=7d" #only 7 days
        ports:
        - containerPort: 9090 # prometheus internal web port
        volumeMounts: # mount the text file
        - name: config-volume
          mountPath: /etc/prometheus/
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config # links to the ConfigMap w
---
apiVersion: v1
kind: Service 
metadata:
  name: prometheus-svc
  namespace: monitoring
spec:
  type: ClusterIP 
  selector:
    app: prometheus 
  ports:
  - port: 9090 # listen on port 9090
    targetPort: 9090 # send traffic to container port 9090