name: DevSecOps Pipeline

# trigger
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# geo-fence
env:
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  # security gate
  security:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov scan
        run: |
          docker run --rm -v $(pwd)/infrastructure:/tf bridgecrew/checkov -d /tf --quiet --compact

  # unit tests
  testing:
    runs-on: self-hosted
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip
          pip install --upgrade pip pytest boto3 moto

      - name: Run pytest
        run: |
          pytest backend/lambda_test.py

  # deploy stage
  deploy:
    runs-on: self-hosted
    needs: [security, testing]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get install -y awscli gnupg software-properties-common
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg --yes
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -y && sudo apt-get install -y terraform

      - name: Apply terraform
        working-directory: ./infrastructure
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Sync s3
        working-directory: ./website
        run: |
          aws s3 sync . s3://omaralqinneh-resume-bucket-eu --delete

      - name: Flush cache
        run: |
          aws cloudfront create-invalidation --distribution-id E14AHE1AA4NA05 --paths "/*"