name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: eu-central-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  security:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scale down monitoring
        run: |
          sudo k3s kubectl scale deployment prometheus grafana -n monitoring --replicas=0 || true

      - name: Checkov scan
        continue-on-error: true
        run: |
          docker run --rm --user $(id -u):$(id -g) -v $(pwd)/infrastructure:/tf bridgecrew/checkov -d /tf --skip-path .terraform --quiet --compact

  testing:
    runs-on: self-hosted
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run pytest in python container
        run: |
          docker run --rm --user $(id -u):$(id -g) -e HOME=/tmp -v $(pwd):/workspace -w /workspace python:3.10-slim bash -c "pip install --quiet pytest boto3 moto && python3 -m pytest backend/lambda_test.py"

  deploy:
    runs-on: self-hosted
    needs: [security, testing]
    if: github.ref == 'refs/heads/main'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform apply in container
        run: |
          docker run --rm --user $(id -u):$(id -g) -v $(pwd):/workspace -w /workspace/infrastructure \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            hashicorp/terraform:latest init
            
          docker run --rm --user $(id -u):$(id -g) -v $(pwd):/workspace -w /workspace/infrastructure \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            hashicorp/terraform:latest apply -auto-approve

      - name: Sync s3 via aws cli container
        run: |
          docker run --rm --user $(id -u):$(id -g) -v $(pwd):/workspace -w /workspace/website \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            amazon/aws-cli s3 sync . s3://omaralqinneh-resume-bucket-eu --delete --exclude "terraform/*"

      - name: Flush cloudfront cache
        run: |
          docker run --rm --user $(id -u):$(id -g) \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            amazon/aws-cli cloudfront create-invalidation --distribution-id E14AHE1AA4NA05 --paths "/*"

  restore-monitoring:
    runs-on: self-hosted
    needs: [security, testing, deploy]
    if: always()
    steps:
      - name: Scale up monitoring
        run: |
          sudo k3s kubectl scale deployment prometheus grafana -n monitoring --replicas=1 || true